<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Social Media Stress Reliever FF - Log</title>
    <link rel="stylesheet" href="logs.css" />
  </head>
  <body>
    <main>
      <h1 data-i18n="title">Protokoll generierter Antworten</h1>
      <p data-i18n="subtitle">Gespeichert werden URL, generierte Antwort sowie Datum/Uhrzeit der Generierung.</p>
      <div class="actions">
        <button id="refresh" data-i18n="refresh">Neu laden</button>
        <button id="clear" data-i18n="clear">Protokoll löschen</button>
      </div>
      <p id="status" role="status"></p>
      <section id="list"></section>
    </main>
    <script src="logs.js"></script>
  </body>
</html>
