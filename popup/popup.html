<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stress Reliever</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="card">
      <h1>Stress Reliever</h1>
      <p class="subtitle">Reduce social feed overload with mindful defaults.</p>

      <label class="row">
        <span>Extension enabled</span>
        <input id="enabled" type="checkbox" />
      </label>

      <label class="row">
        <span>Hide feed surfaces</span>
        <input id="hideFeeds" type="checkbox" />
      </label>

      <label class="stacked" for="breakIntervalMinutes">
        <span>Reminder interval (minutes)</span>
        <input id="breakIntervalMinutes" type="number" min="5" max="90" step="5" />
      </label>

      <button id="saveButton" type="button">Save settings</button>
      <p id="status" role="status" aria-live="polite"></p>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
