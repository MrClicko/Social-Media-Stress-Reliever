<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Social Media Stress Reliever FF - Einstellungen</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main>
      <h1 data-i18n="appTitle">Social Media Stress Reliever FF</h1>
      <p data-i18n="safetyHint">Safety-First: Die Erweiterung sendet nie automatisch. Sie fügt nur einen Entwurf ins Antwortfeld ein.</p>

      <label for="uiLanguage" data-i18n="uiLanguage">Sprache / Language</label>
      <select id="uiLanguage">
        <option value="de">Deutsch</option>
        <option value="en">English</option>
      </select>

      <label for="provider" data-i18n="provider">LLM-Provider</label>
      <select id="provider">
        <option value="openai">OpenAI</option>
        <option value="anthropic">Anthropic</option>
        <option value="google">Google Cloud</option>
        <option value="mistral">Mistral AI</option>
        <option value="local_openai">Lokales LLM (OpenAI-kompatibel)</option>
      </select>

      <label id="credentialLabel" for="apiKey">API-Schlüssel</label>
      <input id="apiKey" type="password" placeholder="API-Key" autocomplete="off" />

      <div id="endpointGroup" class="hidden">
        <label for="endpoint" data-i18n="localEndpoint">Lokale Netzwerkadresse</label>
        <input id="endpoint" type="text" placeholder="http://127.0.0.1:1234" />
      </div>

      <label for="model" data-i18n="model">Modell</label>
      <input id="model" type="text" />

      <label for="maxThreadPosts" data-i18n="maxPosts">Max. Beiträge pro Thread</label>
      <input id="maxThreadPosts" type="number" min="1" max="100" />

      <label for="systemPrompt" data-i18n="systemPrompt">System-Prompt (vollständig editierbar)</label>
      <textarea id="systemPrompt" rows="16"></textarea>

      <div class="actions">
        <button id="save" data-i18n="save">Speichern</button>
        <button id="reset" type="button" data-i18n="reset">Auf Standard zurücksetzen</button>
        <button id="openLogs" type="button" data-i18n="openLogs">Protokoll öffnen</button>
      </div>

      <p id="status" role="status"></p>
      <p class="about" data-i18n="about">Per Vibe-Coding hergestellt durch Matthias Schüssler, matthias@clickomania.ch</p>
    </main>

    <script src="../src/defaults.js"></script>
    <script src="options.js"></script>
  </body>
</html>
